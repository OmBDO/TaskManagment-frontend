<td class="title-select-container" (click)="onTaskDetailNavigate()">
  <div class="p-title">
    <span [innerHTML]="onStatus()"></span>

    <p class="">
      {{ task().title }}
    </p>
  </div>
</td>
<td>
  <p class="date-line">
    {{ task().dueDate | relativeDate }}
  </p>
</td>
<!-- <td>
  <span><img src="../../../assets/image/icons/navigate.svg" alt="" /></span>{{ task().project }}
</td> -->
<td>
  <div class="priority-container">
    <p [class]="PriorityEnum[task().priority]">{{ PriorityEnum[task().priority] }}</p>
  </div>
</td>
<td>
  <div class="status-container">
    <select
      [ngModel]="task().status"
      (ngModelChange)="onStatusChange($event)"
      [class]="StatusEnum[task().status]"
    >
      <option *ngFor="let status of statusOption" [value]="status">
        <p>
          {{ StatusEnum[status] }}
        </p>
      </option>
    </select>
  </div>
</td>
@if (roles().includes(UserEnum.Administrator)) {
  <td>
    <div class="options-wrapper">
      <div class="priority-container">
        <img
          (click)="$event.stopPropagation(); onOptionClick()"
          src="../../../assets/image/icons/dots-horizontal.svg"
          alt="Options"
        />
      </div>
      @if (isOption) {
        <app-task-option
          class="task-option-popup"
          (closeOption)="onCoseOption()"
          [selectedTask]="task()"
        >
        </app-task-option>
      }
    </div>
  </td>
}
