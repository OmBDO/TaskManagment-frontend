<div class="task-header">
  <div class="task-header-left">
    <div class="task-search">
      <input type="text" #titleInput id="title-search" placeholder="Search tasks..." />
      <img src="../../../assets/image/icons/search.svg" alt="" (click)="onSearchByTitle()" />
    </div>
    <div class="sort-button" (click)="onReset()">
      <img src="../../assets/image/icons/switch-vertical.svg" alt="" />
      <h3>reset</h3>
    </div>
  </div>
  <div class="action-task-triggers">
    <!-- <div (click)="onFilter()" class="filter-btn">
      <img src="../../../assets/image/icons/filter.svg" alt="" />
      <p>Filter</p>
      @if (isFilter) {
        <app-task-filter-popup
          (onClose)="onFilterClose()"
          class="filter-popup"
        ></app-task-filter-popup>
      }
    </div> -->
    @if (roles()?.includes(RoleEnum.Administrator)) {
      <div class="task-header-right" (click)="onAddTask()">
        <p>+</p>
        <button class="add-task-btn">Task</button>
      </div>
    }
  </div>
</div>

<router-outlet> </router-outlet>
