<dialog class="dialog-overlay">
  <div class="dialog-box">
    <p class="dialog-message">Do you want to delete this Task?</p>
    <div class="dialog-actions">
      <button class="btn-cancel" (click)="onConfirm(false)">Cancel</button>
      <button class="btn-yes" (click)="onConfirm(true)">Yes</button>
    </div>
  </div>
</dialog>
