<td class="userTask" (click)="onUserTaskClick()">
  <div>
    {{ task().firstName }}
  </div>
</td>
<td>
  <div>
    <span [innerHTML]="onStatus()"></span>

    {{ task().task?.title ?? '' }}
  </div>
</td>
<td>
  {{ task().task?.dueDate ?? '' | relativeDate }}
</td>
<!-- <td>
  <span><img src="../../../assets/image/icons/navigate.svg" alt="" /></span>{{ task().project }}
</td> -->
<td>
  <div class="priority-container">
    <p [class]="PriorityEnum[task().task?.priority ?? PriorityEnum.Low]">
      {{ PriorityEnum[task().task?.priority ?? PriorityEnum.Low] }}
    </p>
  </div>
</td>
